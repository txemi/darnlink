name: ci

on:
  push:
  pull_request:

jobs:
  # Tests across every supported Python (pyproject requires-python = ">=3.10"),
  # on Linux AND Windows — Windows-authored files (BOM, CRLF, path separators) are
  # exactly where this kind of tool breaks, so we run the suite there too.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project (dev extras)
        run: uv pip install -e ".[dev]"
      - name: Run tests
        run: uv run pytest -q
      - name: darnlink self-check (links must be clean)
        run: uv run darnlink .
      - name: darnlink MAX self-check (fail-closed — a link to a file with no uuid fails the gate)
        # README.md deny-listed: it's the PyPI/GitHub landing page, kept frontmatter-free.
        run: uv run darnlink . --robustify --create-frontmatter --no-create-frontmatter-for README.md

  # English-only. The rule is stated in CLAUDE.md and CONTRIBUTING.md; this is what enforces it.
  # Its own job, not a step inside `test`: the check is tree-wide and OS/Python independent, so
  # running it once beats running it eight times across the matrix.
  lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message step below ranges over the commits this PR adds,
          # and with the default depth of 1 there is no range to walk.
          fetch-depth: 0
      # `uv` IS a setup step now, and that is the cost of the migration stated plainly: the gate used
      # to be pure stdlib and could not fail for reasons unrelated to what it guards. It is bought
      # back by a package that has tests and one place to fix a bug for five repos.
      - uses: astral-sh/setup-uv@v5
      # Resolve the tool in its OWN step. Merging "install" and "judge" into one `uvx` call was a
      # critical defect: uvx exits 1 when it cannot resolve the ref -- offline, bad tag, network
      # policy -- which is indistinguishable from "found something". On this workflow that meant a
      # perfectly English issue got LABELLED and publicly told its language was wrong because the
      # runner could not reach a git tag. Separated, a resolve failure fails this step and turns the
      # job red without touching anybody's issue, and the judging step below can only exit with
      # darnlang's own codes.
      - name: Install darnlang
        run: |
          . tools/darnlang_ref.sh
          uv tool install "darnlang[strict] @ $DARNLANG_REF"
      - name: English-only gate — tracked files (fail-closed, baseline pinned at 0)
        run: darnlang check --ext all

      # Commit messages: a surface no file gate can see, and one the local `hooks/commit-msg` cannot
      # be trusted to have covered — hooks are opt-in per clone and one `--no-verify` away. Measured
      # on 2026-08-11 with the file gate green: 7 Spanish commit subjects on `main`.
      # It rides in this job (and not in `lang-pr.yml` with the title check) because it is tied to
      # the COMMITS, so `synchronize` — already a trigger here — is exactly when it must re-run.
      - name: English-only gate — commit messages added by this PR
        if: github.event_name == 'pull_request'
        run: |
          # ONE MESSAGE AT A TIME. Feeding `git log --format=%B` concatenated defeats layer 3,
          # which judges the text as a single block: measured, ONE English line alongside a Spanish
          # subject is enough to dilute it past detection, and the repo's normal commit shape --
          # short subject, long English body -- was missed entirely. The compensating control this
          # workflow is supposed to provide for the hook's known gap did not exist.
          fail=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/one.txt"
            # NO --strict. It was added here as the compensating control for the hook's known gap,
            # and then measured: layer 3 classifies "hooks: apply darnlang to darnlang" as Tagalog
            # at 0.86 confidence, and "ci: uv venv --clear, setup-uv makes one" as Estonian -- both
            # perfectly English. A subject is mostly identifiers and two repetitions of an invented
            # word dominate it; no threshold on confidence, length or word count separates those
            # from real findings, which score identically. On a PUBLIC repo that means blocking a
            # contributor's honest English commit, which is how a gate gets routed around.
            #
            # So the gap stays OPEN and stated: a short subject with no accent and none of the
            # stopwords passes every surface here. A compensating control that does not work is
            # worse than a hole you can see. Layer 3 keeps the surfaces where it was measured to
            # work -- issue bodies and PR descriptions, which are prose.
            darnlang prose "$RUNNER_TEMP/one.txt" \
              --label "commit message $sha" || fail=1
          done < <(git log --format=%H \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          exit "$fail"

  # Exercises the commands users actually run (packaging + entry point + the literal README
  # one-liner) on Linux AND Windows — so the copy-paste one-liner is proven on both.
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Packaged build via uvx (no dev deps)
        run: uvx --from . darnlink .
      - name: The exact README one-liner, end-to-end over git (pinned to this commit)
        run: uvx --from git+https://github.com/txemi/darnlink.git@${{ github.sha }} darnlink .

  # The PowerShell recipe is SHIPPED and nothing has ever parsed it: the recipe tests skip on Windows
  # (`pytestmark`), no job runs `pwsh`, and this PR adds new multi-line constructs to it. Parsing is
  # not testing — it never runs the gate — but it is the cheapest wall against the one failure mode a
  # bash-only fleet cannot see: a consumer on Windows getting a script that does not even start.
  # Its own job on ubuntu (pwsh is preinstalled there), not a step in the 8-cell matrix: the file is
  # OS-independent, so parsing it once is enough.
  ps1-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse recipes/darnlink-gate.ps1
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path recipes/darnlink-gate.ps1).Path, [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host "::error::$($_.ToString())" }; exit 1 }
          Write-Host "recipes/darnlink-gate.ps1 parses clean"
